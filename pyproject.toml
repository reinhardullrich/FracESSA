[build-system]
requires = ["scikit-build-core>=1.0"]
build-backend = "scikit_build_core.build"

[project]
name = "pyfracessa"
dynamic = ["version"]
description = "Exact and floating-point-assisted ESS analysis for symmetric rational payoff matrices"
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
authors = [{ name = "Reinhard Ullrich" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: C++",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Mathematics",
]

[project.optional-dependencies]
parquet = ["pyarrow"]

[project.urls]
Homepage = "https://github.com/reinhardullrich/fracessa"
Repository = "https://github.com/reinhardullrich/fracessa"
Issues = "https://github.com/reinhardullrich/fracessa/issues"

[tool.scikit-build]
minimum-version = "build-system.requires"
cmake.source-dir = "cpp"
cmake.build-type = "Release"
wheel.packages = ["python/pyfracessa"]
sdist.inclusion-mode = "manual"
sdist.exclude = ["**"]
sdist.include = [
    "README.md",
    "pyproject.toml",
    "LICENSE",
    "THIRD_PARTY_NOTICES.md",
    "cpp/CMakeLists.txt",
    "cpp/include/**",
    "cpp/src/**",
    "python/pyfracessa/*.py",
]

[tool.scikit-build.cmake.define]
BUILD_TESTING = false
FRACESSA_NATIVE_ARCH = false
FRACESSA_BUILD_CLI = false
FRACESSA_BUILD_PYTHON = true

[[tool.dynamic-metadata]]
provider = "scikit_build_core.metadata.regex"
field = "version"
input = "cpp/CMakeLists.txt"
regex = '''(?s)project\(\s*fracessa\s+VERSION\s+(?P<value>\d+\.\d+\.\d+\.\d+)'''

[tool.cibuildwheel]
build = "cp{311,312,313,314}-*"
skip = ["*-musllinux_*", "cp3??t-*"]
test-command = "python -c \"from pyfracessa import Matrix, RunConfig, run; assert run('safe', Matrix(1, '2#0,1,0'), config=RunConfig(), run_id='wheel-test')['ess_count'] == 1\""

[tool.cibuildwheel.linux]
archs = ["native"]
manylinux-x86_64-image = "manylinux_2_28"
manylinux-aarch64-image = "manylinux_2_28"

[tool.cibuildwheel.macos]
archs = ["native"]

[tool.cibuildwheel.windows]
archs = ["AMD64"]
