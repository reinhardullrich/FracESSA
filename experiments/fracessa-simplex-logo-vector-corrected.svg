<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="720" viewBox="0 0 1800 720" role="img" aria-labelledby="title desc">
  <title id="title">FracESSA probability simplex logo</title>
  <desc id="desc">A perspective-correct probability simplex on three coordinate axes beside the FracESSA wordmark.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbf8f2"/>
      <stop offset="1" stop-color="#eef4f7"/>
    </linearGradient>
    <radialGradient id="halo">
      <stop offset="0" stop-color="#35cfff" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#35cfff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="plane" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4ce2ff" stop-opacity="0.90"/>
      <stop offset="0.48" stop-color="#087eea" stop-opacity="0.84"/>
      <stop offset="1" stop-color="#173cc7" stop-opacity="0.90"/>
    </linearGradient>
    <linearGradient id="foreground" gradientUnits="userSpaceOnUse" x1="190" y1="385" x2="498.6" y2="650.8">
      <stop offset="0" stop-color="#52dcff"/>
      <stop offset="0.48" stop-color="#52dcff"/>
      <stop offset="0.70" stop-color="#ffc33d"/>
      <stop offset="1" stop-color="#ff7417"/>
    </linearGradient>
    <linearGradient id="orangeShaft" gradientUnits="userSpaceOnUse" x1="304.7" y1="483.8" x2="419.4" y2="582.6">
      <stop offset="0" stop-color="#ff6b18"/>
      <stop offset="0.45" stop-color="#ff9d16"/>
      <stop offset="0.75" stop-color="#ffbd20"/>
      <stop offset="1" stop-color="#ff6a0d"/>
    </linearGradient>
    <linearGradient id="word" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#173fc5"/>
      <stop offset="1" stop-color="#0f8cd9"/>
    </linearGradient>
    <radialGradient id="node" cx="35%" cy="25%">
      <stop offset="0" stop-color="#fff3b5"/>
      <stop offset="0.28" stop-color="#ff9b25"/>
      <stop offset="0.72" stop-color="#f04428"/>
      <stop offset="1" stop-color="#a91820"/>
    </radialGradient>
    <filter id="planeGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
    <filter id="lineGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="8" dy="14" stdDeviation="12" flood-color="#17364e" flood-opacity="0.25"/>
    </filter>
    <marker id="arrow" markerWidth="3.2" markerHeight="3.2" refX="2.9" refY="1.6" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L3.2,1.6 L0,3.2 Z" fill="#17232d"/>
    </marker>
    <marker id="arrowNear" markerWidth="3.4" markerHeight="3.4" refX="3.05" refY="1.7" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L3.4,1.7 L0,3.4 Z" fill="#17232d"/>
    </marker>
  </defs>

  <rect width="1800" height="720" rx="28" fill="url(#background)"/>
  <ellipse cx="302" cy="408" rx="330" ry="310" fill="url(#halo)"/>

  <!-- Pinhole projection of O, e_x, e_y and e_z. Each axis is one straight ray. -->
  <g aria-label="three-dimensional probability simplex">
    <g fill="none" stroke="#17232d" stroke-linecap="round">
      <path d="M190 385 L452.4 343.9" stroke-width="7" marker-end="url(#arrow)"/>
      <path d="M190 385 L180.6 65.5" stroke-width="7" marker-end="url(#arrow)"/>
      <path d="M190 385 L304.7 483.8" stroke-width="11"/>
    </g>

    <!-- The foreground ray stays exactly collinear through its simplex intercept. -->
    <path d="M304.7 483.8 L419.4 582.6" fill="none" stroke="#ff7b13" stroke-width="28" stroke-linecap="round" opacity="0.24" filter="url(#lineGlow)"/>
    <path d="M304.7 483.8 L388.5 555.9" fill="none" stroke="#9e3810" stroke-width="23" stroke-linecap="round"/>
    <path d="M304.7 483.8 L388.5 555.9" fill="none" stroke="url(#orangeShaft)" stroke-width="17" stroke-linecap="round"/>
    <path d="M312 487 L388 553" fill="none" stroke="#ffe36d" stroke-width="3" stroke-linecap="round" opacity="0.85"/>
    <path d="M376.8 569.5 L419.4 582.6 L400.3 542.3 Z" fill="#a62d0b" opacity="0.28" filter="url(#lineGlow)"/>
    <path d="M376.8 569.5 L419.4 582.6 L400.3 542.3 Z" fill="url(#orangeShaft)" stroke="#ffce38" stroke-width="3" stroke-linejoin="round"/>
    <path d="M400.3 542.3 L419.4 582.6 L408 559" fill="#ffe772" opacity="0.75"/>

    <!-- x + y + z = 1 joins the three unit intercepts; O is outside this plane. -->
    <path d="M304.7 483.8 L412.6 350.1 L182.2 122.4 Z" fill="#136de0" opacity="0.28" filter="url(#planeGlow)"/>
    <path d="M304.7 483.8 L412.6 350.1 L182.2 122.4 Z" fill="url(#plane)" stroke="#42ddff" stroke-width="7" stroke-linejoin="round" filter="url(#shadow)"/>
    <path d="M304.7 483.8 L412.6 350.1 L182.2 122.4" fill="none" stroke="#b9f5ff" stroke-width="2.5" stroke-linecap="round" opacity="0.85"/>

    <g fill="url(#node)" stroke="#c42b23" stroke-width="2">
      <circle cx="304.7" cy="483.8" r="17"/>
      <circle cx="412.6" cy="350.1" r="12"/>
      <circle cx="182.2" cy="122.4" r="14"/>
      <circle cx="190" cy="385" r="9"/>
    </g>
  </g>

  <g aria-label="FracESSA wordmark" font-family="DejaVu Sans, sans-serif">
    <text x="720" y="365" font-size="164" font-weight="800" letter-spacing="-10" fill="#17232d">Frac<tspan fill="url(#word)">ESSA</tspan></text>
    <path d="M729 410 H1633" stroke="#ef4e48" stroke-width="9"/>
    <text x="727" y="477" font-size="45" font-weight="600" letter-spacing="13" fill="#17232d">FRACTIONAL ESS ANALYZER</text>
  </g>
</svg>
