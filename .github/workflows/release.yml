name: Build and Release Fracessa

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # ponytail: Windows stays tag-only until its vcpkg setup is fast enough for CI.
        os: ${{ fromJSON(startsWith(github.ref, 'refs/tags/v') && '["ubuntu-22.04","macos-latest","windows-latest"]' || '["ubuntu-22.04","macos-latest"]') }}

    steps:
    - uses: actions/checkout@v6

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.14'

    - name: Install Python test dependencies
      run: python -m pip install pyarrow

    # --- CACHE VCPKG (Windows Only) ---
    - name: Restore vcpkg cache
      if: runner.os == 'Windows'
      uses: actions/cache@v5
      with:
        path: C:/vcpkg/installed
        # Updated key to v2 to ensure we start fresh with the Release-only build
        key: ${{ runner.os }}-vcpkg-flint-static-release-v2
        restore-keys: |
          ${{ runner.os }}-vcpkg-

    # --- DEPENDENCIES (Linux) ---
    - name: Install Dependencies (Linux)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y libgmp-dev libmpfr-dev libflint-dev

    # --- DEPENDENCIES (macOS) ---
    - name: Install Dependencies (macOS)
      if: runner.os == 'macOS'
      run: |
        brew install gmp mpfr flint

    # --- DEPENDENCIES (Windows - PowerShell Optimized) ---
    - name: Install Dependencies (Windows)
      if: runner.os == 'Windows'
      shell: powershell
      run: |
        # 1. Create the custom triplet file using PowerShell (more reliable on Windows runners)
        New-Item -ItemType Directory -Force -Path triplets

        $content = @"
        set(VCPKG_TARGET_ARCHITECTURE x64)
        set(VCPKG_CRT_LINKAGE static)
        set(VCPKG_LIBRARY_LINKAGE static)
        set(VCPKG_BUILD_TYPE release)
        "@

        Set-Content -Path triplets\x64-windows-static-release.cmake -Value $content

        # Verify file creation (for debugging log)
        Get-Content triplets\x64-windows-static-release.cmake

        # 2. Install FLINT using the custom triplet
        # Note the usage of $(Get-Location) to pass absolute path to overlays
        vcpkg install flint:x64-windows-static-release --overlay-triplets="$(Get-Location)/triplets"
        vcpkg integrate install

    # --- CONFIGURE ---
    - name: Configure CMake
      shell: bash
      run: >
        cmake -B cpp/build -S cpp
        -DCMAKE_BUILD_TYPE=Release
        -DFRACESSA_NATIVE_ARCH=OFF
        ${{ runner.os == 'Windows' && '-DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake -DVCPKG_TARGET_TRIPLET=x64-windows-static-release -DVCPKG_OVERLAY_TRIPLETS=triplets' || '' }}

    # --- BUILD ---
    - name: Build
      run: cmake --build cpp/build --config Release -j 4

    - name: Verify release tag matches binary version
      if: startsWith(github.ref, 'refs/tags/v')
      shell: bash
      run: |
        if [[ "$RUNNER_OS" == "Windows" ]]; then
          binary="cpp/build/Release/fracessa.exe"
        else
          binary="cpp/build/fracessa"
        fi
        expected="${GITHUB_REF_NAME#v}"
        actual="$("$binary" --version | tr -d '\r\n')"
        if [[ "$actual" != "$expected" ]]; then
          echo "Release tag $GITHUB_REF_NAME does not match binary version $actual" >&2
          exit 1
        fi

    # --- TEST ---
    - name: Test core and wrapper suites
      shell: bash
      run: |
        ctest --test-dir cpp/build --build-config Release --output-on-failure -j 4
        PYTHONPATH=python python -m unittest discover -s python/fracessa/tests -p "test_*.py"

    # --- STRIP BINARIES ---
    - name: Strip Binary (Linux/Mac)
      if: startsWith(github.ref, 'refs/tags/v') && runner.os != 'Windows'
      run: strip cpp/build/fracessa

    # --- PREPARE ARTIFACTS ---
    - name: Rename Binary (Linux)
      if: startsWith(github.ref, 'refs/tags/v') && runner.os == 'Linux'
      run: mv cpp/build/fracessa fracessa-linux

    - name: Rename Binary (macOS)
      if: startsWith(github.ref, 'refs/tags/v') && runner.os == 'macOS'
      run: mv cpp/build/fracessa fracessa-macos

    - name: Rename Binary (Windows)
      if: startsWith(github.ref, 'refs/tags/v') && runner.os == 'Windows'
      run: mv cpp/build/Release/fracessa.exe fracessa-windows.exe

    # --- UPLOAD TO STAGING ---
    - name: Upload Artifact
      if: startsWith(github.ref, 'refs/tags/v')
      uses: actions/upload-artifact@v7
      with:
        name: binary-${{ matrix.os }}
        path: fracessa-*
        if-no-files-found: error

  # --- PUBLISH RELEASE ---
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Download All Artifacts
      uses: actions/download-artifact@v8
      with:
        pattern: binary-*
        merge-multiple: true

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v3
      with:
        files: |
          fracessa-linux
          fracessa-macos
          fracessa-windows.exe
        draft: false
        prerelease: false
        generate_release_notes: true
